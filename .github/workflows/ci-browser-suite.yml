name: ci-browser-suite

# Runs the Playwright suite (`make test`) against a real Grav container.
#
# WHY THIS EXISTS
# ---------------
# Until now CI ran only `make test-deploy` — the hermetic shell suite. The
# ~258 browser tests, including every guard added to stop "works on dev,
# broken on prod" bugs, ran ONLY on developer machines. A guard that never
# executes in the pipeline is a guard nobody is holding: the very class of
# gap it was written to close.
#
# It is not a full substitute for a developer run. Without
# ~/.gan-secrets/workshop-site.env the authenticated suites skip with a
# reason, which is the documented anonymous-only mode (CLAUDE.md). What it
# DOES cover is everything anonymous — routing, flag profiles, the
# dead-end invariant across both profiles, the welcome-mail content rules,
# the fixture-not-rotted guard — which is where the production bug lived.
on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-suite:
    name: browser-suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # LFS objects ARE needed. This said `lfs: false` on the assumption
        # that no test asserts on image bytes — wrong, and the suite said so:
        # footer.js checks the EU co-funding logo actually loads, and
        # auth-surface.js checks the brand image renders. Without the real
        # objects those are LFS pointer files and all three fail. Worth the
        # extra checkout time; a "broken image" test that cannot see a broken
        # image is not a test.
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Grav
        # PUID/PGID must be the runner's, derived rather than hardcoded: the
        # image chowns the bind-mounted ./config to them, and with the wrong
        # ids the repo's own config becomes unwritable — globalSetup then dies
        # trying to write the Mailpit override. Unset locally, where compose
        # defaults to 1000.
        # grav-up.sh validates the port, waits for Grav to answer, and
        # writes .gan/port-registry.json — the same discovery chain the
        # Makefile and playwright.config.js use locally, so CI exercises
        # the real path rather than a CI-only shortcut.
        run: PUID="$(id -u)" PGID="$(id -g)" scripts/grav-up.sh . 8080

      - name: Start Mailpit
        # Without the sink the mail-bearing specs skip with a reason. They
        # are the ones that proved the welcome mail's content rules, so it
        # is worth the container.
        run: scripts/mailpit-up.sh .

      - name: Seed sample content
        # Events, roadmap items, team. The dates are @today±N tokens
        # expanded here — a fixture that cannot rot is the precondition for
        # every event-card assertion downstream.
        run: |
          CONTAINER="$(node -e 'process.stdout.write(require("./scripts/discover-grav-port.js").discoverGravEnv(".").container)')"
          tests/fixtures/grav-seeds/sample-content/apply.sh "$CONTAINER" --force

      - name: Create an admin account
        # WITHOUT THIS THE WHOLE SITE IS UNREACHABLE. A fresh checkout has no
        # user accounts — they are live state, never committed — and Grav's
        # admin plugin then 302s EVERY route to /admin to create the first
        # user. Locally nobody notices: a working checkout has had accounts
        # since the day it was set up. On a runner every single browser test
        # failed, and it looked like broken event rendering rather than a
        # site that never served a page at all.
        #
        # The password is throwaway and never used — the authenticated suites
        # gate on ~/.gan-secrets, which CI does not have. This account exists
        # only to satisfy Grav's first-run check.
        run: |
          CONTAINER="$(node -e 'process.stdout.write(require("./scripts/discover-grav-port.js").discoverGravEnv(".").container)')"
          docker exec -u abc -w /app/www/public "$CONTAINER" \
            bin/plugin login new-user \
              -u ci-admin -e ci@example.invalid \
              -p "$(openssl rand -base64 24)" \
              -N 'CI Admin' -t admin -s enabled -P b -n
          docker exec -u abc -w /app/www/public "$CONTAINER" bin/grav clearcache

      - name: Run browser suite
        run: make test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop Grav
        if: always()
        run: scripts/grav-down.sh . || true

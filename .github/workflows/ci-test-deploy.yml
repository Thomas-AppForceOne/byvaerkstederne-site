name: ci-test-deploy

# Runs the hermetic deploy regression suite (`make test-deploy`) on every
# pull request and on pushes to the integration branches. No secrets, no
# Docker, no deploy host — every probe builds its own throwaway git
# fixtures (see specifications/ci_release_protection_part1_specification.md,
# "test-deploy" job). This file is deliberately separate from
# ci-release-guards.yml so it runs on PRs of ANY base, while the
# main-only release guards stay scoped to their own trigger.
on:
  pull_request:
  push:
    branches: [develop, main]

# Cancel superseded runs on the same PR head / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Read-only: this workflow never needs a write- or deploy-scoped token.
permissions:
  contents: read

jobs:
  test-deploy:
    # Explicit; equals the key and the spec's required-check string.
    # Required status check — must match the `main`/`develop` ruleset
    # string; do not rename (a silent rename freezes PRs on a pending check).
    name: test-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy-test tool dependencies
        # The hermetic suite shells out to a few external tools. ubuntu-latest
        # already ships bash, coreutils, git, make, rsync, curl, python3 and
        # xxd; `age`/`age-keygen` — used by the real-mode backup.sh probe in
        # tests/deploy/migrate.sh — is the only one not preinstalled. Without
        # it that probe records a failure instead of exercising encryption.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age

      - name: Install migrations dependencies
        # migrations/vendor/ is gitignored; run-migration.php dies with
        # "FATAL: migrations/vendor/autoload.php missing" without it, which
        # fails the WI-6 migration-bump probes in tests/deploy/promote-to-staging.sh.
        run: composer install --no-interaction --no-progress --working-dir=migrations

      - name: Syntax-check deploy scripts (bash -n)
        # Parse every deploy/test script in full. `make test-deploy` exercises
        # behaviour, but its --dry-run paths can exit BEFORE a syntactically
        # broken block executes (e.g. an unescaped apostrophe in a comment
        # inside a single-quoted bv_remote_run body), so a syntax error there
        # slips through. `bash -n` parses each file end-to-end and catches it.
        # Runs before the suite so a parse error fails fast with a clear pointer.
        run: |
          fail=0
          for f in deploy/*.sh deploy/lib/*.sh tests/deploy/*.sh; do
            [ -f "$f" ] || continue
            if ! bash -n "$f" 2>/tmp/bn.err; then
              echo "::error file=$f::bash -n syntax check failed"
              cat /tmp/bn.err
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more deploy scripts failed bash -n (see annotations above)." >&2
            exit 1
          fi
          echo "✓ all deploy scripts parse clean"

      - name: Run deploy regression suite
        # `make test-deploy` is hermetic — default checkout depth is
        # sufficient. The job fails iff any probe fails.
        run: make test-deploy

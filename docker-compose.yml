services:
  grav:
    # Built from ./Dockerfile so PHP and Grav are pinned SEPARATELY.
    #
    # This used to be a single pinned image, which welded the two together:
    # pulling a newer one to get a newer PHP dragged the local CMS from Grav
    # 1.7.49.5 to 2.0.20 — a major version ahead of every tier — while
    # staying put pinned local PHP at 8.3 against tiers serving 8.5. There
    # was no third option as long as one image decided both.
    #
    #   PHP   from the base image digest (see Dockerfile's PHP_BASE)
    #   GRAV  from GRAV_VERSION, the same zip deploy.sh ships to the tiers
    #
    # scripts/grav-up.sh reads GRAV_VERSION out of deploy.sh so the two
    # cannot drift; the Dockerfile's default is a fallback for a direct
    # `docker build`, and unit-grav-parity.sh fails if it disagrees.
    build:
      context: .
      args:
        GRAV_VERSION: ${GRAV_VERSION:-1.7.52}
    image: byv-grav:${GRAV_VERSION:-1.7.52}
    container_name: ${GRAV_CONTAINER:-grav}
    environment:
      # The image chowns the bind-mounted ./config to this uid/gid. Hardcoding
      # 1000 assumes the host user is uid 1000 — true on a typical Mac dev
      # box, false on a GitHub runner, where it left the repo's own config
      # unwritable and the suite died in globalSetup trying to write the
      # Mailpit override. Default to 1000 so nothing changes locally; CI
      # passes its own.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Copenhagen
    volumes:
      - ${GRAV_ROOT:-./config}:/config
    ports:
      - "${GRAV_PORT:-8080}:80"
    restart: unless-stopped

  # WI-6 — API-queryable, non-delivering mail sink. Scoped to the `test`
  # compose profile so it ONLY runs when explicitly requested (e.g.
  # scripts/mailpit-up.sh / `docker compose --profile test up`), never under
  # the plain dev `make start` / `:8080` workflow.
  #
  # The Grav container reaches it as `mailpit:1025` on the shared default
  # compose network (same compose project). Email-bearing tests then read the
  # captured message over Mailpit's REST API at MAILPIT_URL (host-side port
  # below) to extract the activation/reset token and drive it.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ${MAILPIT_CONTAINER:-mailpit}
    profiles: ["test"]
    environment:
      - TZ=Europe/Copenhagen
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    ports:
      # Host-side ports are parameterised so multiple worktrees don't collide.
      # 1025 = SMTP, 8025 = REST API / web UI.
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_API_PORT:-8025}:8025"
    # Ephemeral test sink — don't auto-resurrect on host reboot like the dev
    # Grav service does. mailpit-up.sh starts it on demand; mailpit-down.sh removes it.
    restart: "no"

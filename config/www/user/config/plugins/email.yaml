# Email plugin — repo-tracked, NON-SECRET defaults only.
#
# This file carries the transport ENGINE and the non-prod From identity.
# It deliberately contains NO host / username / password literals.
#
# The SMTP transport block (server/port/user/password/encryption) is
# provisioned PER TIER, out of band, in the tier's gitignored
#   config/www/user/env/<host>/config/plugins/email.yaml
# It sits under config/plugins/ (NOT directly under config/) so Grav's
# environment merge folds it into the plugins.email namespace and it actually
# overrides this file at runtime; a file directly under env/<host>/config/
# would map to a dead top-level `email` namespace the plugin never reads.
# deploy.sh wires that per-tier file into each release via the §Symlink
# contract (see deploy/deploy.sh and deploy/lib/atomic-release.sh). An
# operator- or hand-placed env email.yaml that deploy.sh does not know about
# is never linked into a release, so the deploy.sh automation — not manual
# placement — is the supported path.
#
# From identity is PER TIER (see the spec Prerequisites table):
#   dev / test / staging  -> noreply@hackersbychoice.dk   (this default)
#   prod                  -> noreply@byvaerkstederne.dk   (overridden in
#                            user/env/www.byvaerkstederne.dk/config/plugins/email.yaml)
# The site contact address kontakt@byvaerkstederne.dk (site.yaml) is NOT the
# transactional From — transactional mail keeps its own noreply@ identity.
#
# ABSENT-FILE CONTRACT: if a tier's env email.yaml is missing, transactional
# mail degrades to non-sending (the engine below points at an SMTP host that
# only the env override supplies). deploy/preflight emits a non-fatal WARN so
# the silent degrade becomes visible; the tier still boots.
#
# UNDER TEST (CI / local Playwright): the Playwright run repoints this mailer
# block at Mailpit (mailpit:1025, no auth) for the duration of the run so the
# real login + email plugin path runs against an API-queryable sink. The
# override is written by tests/global-setup.js (only when the sink is reachable)
# and restored by tests/global-teardown.js via `git checkout`; a setup-time
# guard aborts the run if a prior crash left this file modified. scripts/
# mailpit-up.sh only starts the sink container — it never edits this file.
# See tests/helpers/mailer.js and tests/fixtures/grav-seeds/README.md.
enabled: true
from: 'noreply@hackersbychoice.dk'
from_name: 'Byværkstederne'
charset: utf-8
content_type: text/html
debug: false
mailer:
  engine: smtp
  # The smtp block below is intentionally credential-free. The per-tier
  # env email.yaml supplies server/port/user/password/encryption. Without
  # it, no real transport is configured and mail does not send (WARN at
  # deploy/preflight; see ABSENT-FILE CONTRACT above).
  smtp:
    encryption: tls

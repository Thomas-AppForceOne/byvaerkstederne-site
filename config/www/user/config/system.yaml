absolute_urls: false

reverse_proxy_setup: true

# Grav 2.0 made every forwarded header OPT-IN, defaulting them all to false
# "to prevent client-supplied spoofing of client IP, host, port, or protocol"
# (its own words, system/config/system.yaml). On Grav 1.7, reverse_proxy_setup
# alone was enough for Uri::scheme() to read X-Forwarded-Proto; on 2.0 it is
# gated behind system.http_x_forwarded.protocol as well.
#
# That is not cosmetic. Grav computes the session cookie's Secure flag as
#   session.secure OR (session.secure_https AND scheme === 'https')
# so without this key a proxied tier stops seeing https, and its session
# cookies silently lose Secure. Caught by tests/anonymous/session-cookie.js
# during the 1.7 → 2.0 migration; it would otherwise have shipped as a
# security regression nobody could see in a browser over real TLS.
#
# ONLY `protocol` is enabled. Every tier sits behind a proxy that sets and
# overwrites X-Forwarded-Proto (one.com Varnish; LiteSpeed on prod), so
# trusting it is sound. host/port/ip stay off: nothing here needs them, and
# each one trusted without a proxy that overwrites it is a spoofing surface.
http_x_forwarded:
  protocol: true

# WI-5: pin the password and username policy in this repo so a Grav-core
# upgrade or a differently-configured tier cannot silently weaken them. These
# must agree exactly with the client-side checks (register.html.twig) and the
# page-level validate.pattern (register.md):
#   - username_regex string-equals register.md's username validate.pattern and
#     the JS literal in register.html.twig.
#   - pwd_regex (>=12 chars, no character-class rules) is proven equivalent to
#     the imperative client-side JS chain by the shared accept/reject
#     truth-table fixture (tests/anonymous/password-policy.js).
#
# LENGTH ONLY, ON PURPOSE. The previous rule was >=8 with an upper, a lower
# and a digit. Composition rules of that shape do not buy entropy — they push
# people to "Sommer2026!", which every cracking dictionary already holds — and
# NIST SP 800-63B has recommended dropping them for years. Twelve characters
# with no class requirement is both stronger and easier to satisfy with a
# passphrase or a password manager. The guessable-word rule that composition
# rules were really reaching for lives in the blocklist
# (config/plugins/account-manager.yaml), which a regex cannot express.
username_regex: '^[a-z0-9_-]{3,16}$'
pwd_regex: '.{12,}'

# WI-4: harden the session cookie. httponly + SameSite=Lax are scheme-
# independent and pinned here for every tier (SameSite=Lax, not Strict, so
# activation/reset links arriving as top-level navigations from email still
# carry the cookie while cross-site POST is blocked).
#
# The Secure flag is deliberately NOT hard-forced. Grav's SessionServiceProvider
# computes it as `session.secure OR (session.secure_https AND scheme == https)`.
# secure_https defaults to true, and with reverse_proxy_setup (above) Grav reads
# the scheme from X-Forwarded-Proto — so on a TLS tier behind the proxy the
# cookie automatically gets Secure, while plain-HTTP localhost (make start /
# make test-auth, no XFP) correctly does NOT, so local sessions still hold.
# Pinning `secure: true` here instead would force Secure even over local HTTP,
# breaking every authenticated flow that isn't behind TLS — which is why we let
# Grav's per-scheme detection do it.
#
# MANUAL RELEASE GATE (WI-4): on the first deploy to a real TLS tier, capture
# the live Set-Cookie and confirm Secure is present and a login completes
# through the proxy — the real proxy must forward X-Forwarded-Proto and must not
# strip the flag. The localhost X-Forwarded-Proto substitute only proves Grav
# EMITS Secure when told HTTPS.
session:
  httponly: true
  samesite: 'Lax'

home:
  alias: '/home'

pages:
  theme: byvaerkstederne
  markdown:
    extra: true
  process:
    markdown: true
    twig: false

cache:
  enabled: false
  check:
    method: file
  driver: auto
  prefix: 'g'

twig:
  cache: true
  debug: true
  auto_reload: true
  autoescape: true

assets:
  css_pipeline: false
  css_minify: true
  css_rewrite: true
  js_pipeline: false
  js_module_pipeline: false
  js_minify: true

errors:
  display: 0
  log: true

debugger:
  enabled: false
  twig: true
  shutdown:
    close_connection: true
gpm:
  verify_peer: true

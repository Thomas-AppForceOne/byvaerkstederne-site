# Feature-flag FALLBACK — deliberately empty, so it fails closed.
#
# Grav resolves its environment from the request Host header and loads
# user/env/<host>/config/features.yaml. THIS file is what it falls back to when
# the Host matches no env directory — an unknown hostname, a bare apex, a
# health check, a CLI run (Grav resolves those to the environment `cli`).
#
# It used to hold the developer's all-on profile. That made every unprofiled
# entrance an all-features entrance, in production. Measured on 2026-08-15:
#
#   www.byvaerkstederne.dk/vedtaegter   404   (prod profile — flag off)
#   byvaerkstederne.dk/vedtaegter       200   (this file — flag on)
#
# The same held for /privatlivspolitik, /referater and /presse, and for the
# one.com tiers reached as hackersbychoice.dk/<tier>/. Same release, same
# docroot, different Host.
#
# An empty `enabled` map resolves every catalogue flag to false and logs no
# warning. A host that was never given a profile now shows the site's
# unflagged core and nothing else — the safe direction to be wrong in.
#
# The developer's all-on world moved to user/env/localhost/config/features.yaml
# (Grav aliases 127.0.0.1 and ::1 to localhost, so local dev and both Playwright
# suites resolve it), and that directory is excluded from the deploy package.
#
# Do NOT put flags back in here. A flag belongs in the profile of the host that
# should see it. See decisions/ADR-007-feature-flag-fallback-fails-closed.md.
enabled: {}

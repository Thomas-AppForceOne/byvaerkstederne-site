name: Event Manager
version: 1.0.0
description: "Frontend event CRUD for organizers: create, edit, publish and archive own events in the begivenheder Flex directory without admin-panel access."
icon: calendar
author:
  name: Byværkstederne
homepage: https://byvaerkstederne.dk
keywords: events, flex, crud
bugs: https://byvaerkstederne.dk
license: MIT

dependencies:
  - { name: grav, version: '>=1.7.25' }
  - { name: flex-objects }
  - { name: form }
  - { name: login }
  - { name: feature-flags }

form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: Plugin Status
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

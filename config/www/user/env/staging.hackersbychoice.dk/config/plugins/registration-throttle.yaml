# Enable the registration throttle on this tier (staging.hackersbychoice.dk).
# Throttle kicks in after the 5th registration from an IP: attempts 1–5 pass,
# the 6th and beyond are blocked until older attempts age out of the 60-minute
# window (~1-hour cooldown). The same limits are set on every tier
# (dev/test/staging/prod). The plugin's repo default stays disabled, so local
# dev (make start) and the CI/Playwright suite are NOT throttled.
enabled: true
max_count: 5
interval: 60

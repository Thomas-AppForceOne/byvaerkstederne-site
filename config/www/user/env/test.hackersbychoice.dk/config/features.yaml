# Test-tier environment profile.
#
# This profile is active when the site is served under the host
# `test.hackersbychoice.dk` (see adjacent README.md for the four-tier
# topology).
#
# The test tier is OPERATIONAL preview state: flip flags here freely to
# try unreleased or temporary features before a staging/prod rollout —
# no test code depends on this file's contents (the browser suites' all-off
# fixture is the dedicated, never-deployed `env/flags-off.invalid/`
# profile). A missing key resolves to `false` (FlagStore missing-key
# rule), so only the flags you want ON need a line here; remove the line
# to turn a surface back off.
#
# Values are the strict strings `"true"` or `"false"`. Any other value
# (bare YAML booleans, `TRUE`, `1`, `yes`, nulls, nested maps) is treated
# by FlagStore as invalid, logs a warning, and fails closed. The file
# contains flag metadata only — no credentials, tokens, API keys, or
# secrets of any kind may appear here (structurally enforced by
# FeatureFlagCatalogueTest's payload checks).
enabled:
  # Member self-service (/konto) — on for super sign-off before the
  # staging/prod rollout.
  account_self_service: "true"
  # Event RSVP and calendar enhancements — newly shipped, testing on test tier
  event_rsvp: "true"
  workshop_calendar: "true"
  workshop_calendar_filters: "true"
  workshop_calendar_featured: "true"
  # Organizer event CRUD (opret/rediger/slet/arrangørpanel) — on so testers
  # who are granted the organizer role can exercise event management.
  event_management: "true"

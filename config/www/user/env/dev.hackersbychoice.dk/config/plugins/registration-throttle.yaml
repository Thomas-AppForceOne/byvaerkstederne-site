# Per-tier override — enable the registration throttle on DEV only.
# The plugin's repo default stays `enabled: false`; this turns it on for the
# dev tier (Grav reads env/<host>/ by hostname). Inherits the Danish throttle
# message from the plugin default; pins the rate here so it's explicit.
#
# 10 per 60 minutes per IP is a backstop to the honeypot, not a tight gate.
# Raise max_count if you expect a shared-IP signup burst; set max_count: 0 to
# leave the plugin loaded but switch the limit off.
enabled: true
max_count: 10
interval: 60

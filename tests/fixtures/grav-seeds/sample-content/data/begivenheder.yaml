  title: "Sommerkoncert på havnen — frivillige søges"
  description: "Eventværkstedet arrangerer sommerkoncert på havnen og mangler frivillige til opsætning, bar og nedtagning. Du får fri entré, aftensmad og æren. Tilmeld dig en tjans!"

event002:
  published: true
  title: "Repair Café — tag dine ting med"
  description: "Har du en lampe der blinker, en cykel der knirker eller bukser med hul? Tag dine ting med, og lad os reparere dem sammen i stedet for at smide dem ud. Kaffen er klar."
  group: makerspace
  badge: "Makerspace & Reparation"
  event_date: "2026-08-01"
  event_time: "10:00 - 13:00"
  location: "Makerspace-lokalet, Nørregade 21, Hundested"
  capacity: "12"
  event_type: "Gratis"
  button_text: "Tilmeld"
  button_url: "#"
  button_style: secondary
  featured: true
  featured_tag: "Populær"
  details_html: |
    <h3>Hvad kan repareres?</h3>
    <ul>
    <li><strong>Elektronik</strong> — lamper, radioer, køkkenmaskiner (ikke hvidevarer)</li>
    <li><strong>Cykler</strong> — lapning, bremser, gear</li>
    <li><strong>Tøj og tekstiler</strong> — huller, lynlåse, oplægning</li>
    <li><strong>Møbler</strong> — mindre lim- og samlereparationer</li>
    </ul>
    <h3>Sådan foregår det</h3>
    <p>Du reparerer selv — vores frivillige fiksere hjælper og vejleder undervejs. Regn med 30-60 minutter pr. ting, og tag gerne reservedele med hvis du har dem.</p>
    <p><em>Vi kan ikke love at alt kan reddes, men det lykkes for ca. 7 ud af 10 ting.</em></p>

  details_html: |
    <h3>Tjanser</h3>
    <ul>
    <li><strong>Opsætning (16:00-18:00)</strong> — scene, bænke, lyskæder</li>
    <li><strong>Bar (18:00-21:30)</strong> — salg af øl, vand og kaffe, to pr. vagt</li>

event004:
  published: true
  title: "Silketryk intro v. Lene Pels"
  description: "Lær at trykke dine egne motiver på tekstil. Vi arbejder med rammer og farver — medbring gerne en t-shirt eller et stykke stof. Brugerbetaling til materialer (ca. 50 kr.)."
  group: kreativ
  badge: "Krea Café"
  event_date: "2026-08-08"
  event_time: "11:00 - 14:00"
  location: "Krea Café, Nørregade 21, Hundested"
  capacity: "6"
  event_type: "Brugerbetaling"
  button_text: "Tilmeld"
  button_url: "#"
  button_style: tertiary
  featured: false
  featured_tag: ""
  details_html: |
    <h3>Om workshoppen</h3>
    <p>Lene Pels har arbejdet med silketryk i over 20 år og guider dig gennem hele processen: motivvalg, klargøring af ramme, farveblanding og selve trykket.</p>
    <h3>Medbring</h3>
    <ul>
    <li>En t-shirt, mulepose eller et stykke stof i bomuld (lyse farver virker bedst)</li>
    <li>Evt. en skitse af dit motiv — enkle silhuetter fungerer bedst til første tryk</li>
    <li>Tøj der må få farve på</li>
    </ul>
    <h3>Priser</h3>
    <table>
    <thead><tr><th>Materiale</th><th>Pris</th></tr></thead>
    <tbody>
    <tr><td>Farve og emulsion (obligatorisk)</td><td>50 kr.</td></tr>
    <tr><td>Ekstra tryk på eget stof</td><td>10 kr. pr. stk.</td></tr>
    </tbody>
    </table>
    <p><em>Betaling med MobilePay på dagen.</em></p>
